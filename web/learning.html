<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>摄影能力地图 · 摄影学习</title>
  <link rel="stylesheet" href="/static/learning.css?v=2-map">
  <script src="/static/learning.js?v=2-map" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到内容</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand-mark" href="#map" aria-label="摄影学习首页">R<span>.</span></a>
      <a class="home-link" href="#map">摄影学习</a>
      <label class="search-field"><i data-icon="search"></i><input id="search" type="search" autocomplete="off" maxlength="100" placeholder="搜索专题" aria-label="搜索专题"><kbd>/</kbd></label>
      <div class="recent-wrap">
        <button id="recent-toggle" class="text-control" aria-expanded="false" aria-controls="recent-panel">最近学习</button>
        <section id="recent-panel" class="recent-panel" aria-label="最近学习" hidden></section>
      </div>
      <a id="reference-link" class="reference-link" href="/">拍摄参考<i data-icon="arrow-up-right"></i></a>
    </div>
  </header>
  <main id="main" tabindex="-1">
    <section id="map-view" class="page-shell">
      <header class="map-heading"><h1 id="map-title" tabindex="-1">摄影能力地图</h1><p>把喜欢的画面，拆成可以练习的能力。</p></header>
      <div id="topic-grid" class="topic-grid" aria-label="摄影学习专题"></div>
      <section id="empty-state" class="empty-state" hidden><h2>没有找到这个专题</h2><p>试试“构图”“焦段”或“人物”。</p><button id="clear-search" class="underlined-control">查看所有专题</button></section>
      <p id="asset-notice" class="asset-notice" role="status" hidden></p>
      <footer class="page-footer"><span>从画面出发，带着问题回来。</span><small>视觉原型 · 专题内容与图片标注仅作示例</small></footer>
    </section>
    <section id="topic-view" class="page-shell" hidden aria-label="专题研究">
      <a id="back-to-map" class="back-link" href="#map"><i data-icon="arrow-left"></i>摄影能力地图</a>
      <div class="topic-layout">
        <article id="research-note" class="research-note" aria-labelledby="topic-title"></article>
        <section class="case-section" aria-labelledby="case-heading">
          <header class="case-heading"><h2 id="case-heading">精选案例</h2><p>对照画面，重新看一遍。</p></header>
          <div id="case-gallery" class="case-gallery" aria-label="精选案例图片"></div>
          <p class="case-disclaimer">图片用于版式预览；成败、焦段与标签均为示例标注。</p>
        </section>
      </div>
    </section>
  </main>
  <dialog id="case-viewer" class="case-viewer" aria-labelledby="viewer-title">
    <button id="viewer-close" class="icon-control viewer-close" aria-label="关闭案例"><i data-icon="x"></i></button>
    <div class="viewer-layout">
      <div class="viewer-stage"><img id="viewer-image" alt=""><div class="viewer-controls"><button id="viewer-prev" class="icon-control" aria-label="上一个案例"><i data-icon="chevron-left"></i></button><span id="viewer-position" aria-live="polite"></span><button id="viewer-next" class="icon-control" aria-label="下一个案例"><i data-icon="chevron-right"></i></button></div><p id="viewer-image-error" role="status" hidden>这张图片暂时无法显示，请切换案例或稍后重试。</p></div>
      <div class="viewer-caption"><p id="viewer-kind" class="viewer-kind"></p><h2 id="viewer-title"></h2><p id="viewer-tags" class="viewer-tags"></p><div class="viewer-observation"><h3>带着这个问题看</h3><p id="viewer-note"></p></div><p class="mock-note">示例标注，用于体验案例对照方式。未核验原片焦段，也不代表对作品的成败判断。</p><div class="source-info"><p id="viewer-author"></p><a id="viewer-source" target="_blank" rel="noopener noreferrer">查看原始出处<i data-icon="external-link"></i></a><details id="viewer-rights"><summary>素材说明</summary><p id="viewer-restrictions"></p></details></div></div>
    </div>
  </dialog>
</body>
</html>
