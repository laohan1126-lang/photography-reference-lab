<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#14242e">
  <meta name="description" content="私人 cosplay 与日常人像审美参考库">
  <title>参考实验室 · Photography Reference Lab</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <div id="login-screen" class="login-screen" hidden>
    <section class="login-card">
      <span class="eyebrow">PHOTOGRAPHY REFERENCE LAB</span>
      <h1>让喜欢的画面，<br>成为自己的拍摄方法。</h1>
      <p>私人审美库 · 独立大图筛选 · 可执行的现场卡</p>
      <form id="login-form">
        <label>访问口令<input id="login-token" type="password" autocomplete="current-password" required placeholder="输入本机访问口令"></label>
        <button class="primary" type="submit">进入我的参考库</button>
      </form>
      <small>首次启动后，在项目目录执行 <code>python -m ref_lab token</code> 查看口令。图片和数据默认不公开。</small>
      <p id="login-error" class="error-text" role="alert"></p>
    </section>
  </div>
  <div id="application" class="app-shell" hidden>
    <aside class="sidebar">
      <a class="brand" href="/" aria-label="参考实验室首页"><span class="brand-mark">R.</span><span>参考实验室<small>REFERENCE LAB</small></span></a>
      <div class="side-heading"><span>我的角色项目</span><button id="new-project" class="icon-button" aria-label="新建角色项目">＋</button></div>
      <nav id="project-list" aria-label="角色项目"></nav>
      <div class="side-note"><span class="status-dot"></span><strong>PRIVATE WORKSPACE</strong><p>审美由你决定。<br>图片事实与 AI 推测分开保存。</p></div>
      <button id="lock-library" class="quiet">锁定参考库</button>
    </aside>
    <main class="workspace">
      <header class="topbar"><span>摄影 / 私人参考库</span><span id="connection-status">已连接本地数据源</span></header>
      <section id="project-header" class="project-header"></section>
      <div id="stats" class="stats" aria-label="项目统计"></div>
      <nav id="view-tabs" class="view-tabs" aria-label="工作区视图">
        <button data-view="references" class="active">候选池</button><button data-view="field">现场卡</button>
        <button data-view="inspiration">灵感库</button><button data-view="jobs">采集与分析</button>
        <button data-view="notes">摄影笔记</button><button data-view="events">变更记录</button>
      </nav>
      <div id="view" aria-live="polite"></div>
      <footer class="workspace-footer"><span>先选择，再分析。未知不等于通过。</span><span id="version">v0.2</span></footer>
    </main>
  </div>
  <dialog id="editor" class="editor-dialog"><div class="dialog-header"><h2 id="editor-title"></h2><button id="editor-close" class="icon-button" aria-label="关闭对话框">×</button></div><div id="editor-content"></div></dialog>
  <dialog id="lightbox" class="lightbox"><div class="lightbox-bar"><span id="lightbox-title"></span><button id="lightbox-zoom">切换原尺寸</button><button id="lightbox-close">关闭</button></div><div class="lightbox-image"><img id="lightbox-image" alt="独立来源图片"></div></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
