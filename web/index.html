<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff8f8"><title>参考实验室 · Arima Kana</title>
<link rel="stylesheet" href="/static/styles.css?v=canvas3"><link rel="stylesheet" href="/static/kana-editorial.css?v=canvas3">
<script src="/static/kana.js?v=canvas3" defer></script><script src="/static/library-browser.js?v=20261002" defer></script><script src="/static/app.js?v=20261002" defer></script></head>
<body class="kana-canvas">
<div id="login-screen" class="login-screen" hidden><section class="login-card"><h1>留住喜欢的画面。</h1><form id="login-form"><label>访问口令<input id="login-token" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">进入参考库</button></form><p id="login-error" class="error-text" role="alert"></p></section></div>
<div id="application" class="app-shell" hidden>
<div class="canvas-scene" aria-hidden="true"><img id="kana-theme-image" src="/static/private/kana/portrait.webp" alt="" draggable="false"><div class="canvas-light"></div><img class="canvas-ribbons" src="/static/ui-art/kana-frame.svg" alt=""><figure class="scene-print print-rain"><img src="/static/private/kana/rain.webp" alt=""></figure><figure class="scene-print print-summer"><img src="/static/private/kana/summer.webp" alt=""></figure><figure class="scene-print print-left"><img src="/static/private/kana/portrait.webp" alt=""></figure></div>
<a class="brand" href="/" aria-label="参考实验室首页"><svg viewBox="0 0 24 24" class="ui-icon" aria-hidden="true"><path d="M4 7h4l2-3h4l2 3h4v13H4z"/><circle cx="12" cy="13" r="4"/></svg><span>参考实验室<small>REFERENCE LAB</small></span></a>
<aside class="sidebar" aria-label="主导航"><nav class="photography-branches"><span aria-current="page"><svg viewBox="0 0 24 24" class="ui-icon" aria-hidden="true"><path d="M4 7h4l2-3h4l2 3h4v13H4z"/><circle cx="12" cy="13" r="4"/></svg><span>拍摄参考<small>PHOTO STAGE</small></span></span><a id="learning-link" href="/learning"><svg viewBox="0 0 24 24" class="ui-icon" aria-hidden="true"><path d="M4 7h4l2-3h4l2 3h4v13H4z"/><circle cx="12" cy="13" r="4"/></svg>摄影学习</a></nav><button id="toggle-project-nav" aria-controls="project-navigation" aria-expanded="false"><svg viewBox="0 0 24 24" class="ui-icon" aria-hidden="true"><path d="M3 6h7l2 3h9v11H3z"/><path d="M3 6V4h7l2 2h8v3"/></svg>项目与资料</button><nav id="global-nav" aria-label="我的资料"><button data-view="inspiration"><svg viewBox="0 0 24 24" class="ui-icon" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9z"/></svg>收藏夹</button><button data-view="library"><svg viewBox="0 0 24 24" class="ui-icon" aria-hidden="true"><path d="M3 6h7l2 3h9v11H3z"/><path d="M3 6V4h7l2 2h8v3"/></svg>跨项目图库</button><details class="global-more"><summary>更多工作区</summary><button data-view="study">待筛摄影参考</button><button data-view="profile">审美画像</button><button data-view="jobs">采集任务</button><button data-view="notes">摄影笔记</button><button id="lock-library">锁定参考库</button></details></nav></aside>
<main class="workspace">
<header class="canvas-hero" aria-label="有马加奈主题"><div class="canvas-title" id="canvas-title"><span class="title-jp" lang="ja">この一枚、どうする？</span><img class="kana-display-kana-logo" src="/static/ui-art/kana-display-logo.svg" alt="ARIMA Kana · 有马加奈" draggable="false"><p>把喜欢的画面，收进自己的摄影手帖。</p></div><div class="canvas-note"><img src="/static/ui-art/kana-wordmark.svg" alt="いい写真、見つけよっ！"><p lang="ja">たくさんの「好き」を、<br>コレクションに。</p></div><span id="connection-status" class="connection-status">连接中</span><button id="kana-asset-notice" hidden>主题素材未安装 · 查看说明</button></header>
<nav id="view-tabs" class="view-tabs" aria-label="工作区视图"><button data-view="references" class="active"><svg viewBox="0 0 24 24" class="ui-icon" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9z"/></svg>挑参考</button><button data-view="selected">角色精选</button><button data-view="field">现场卡</button><button data-view="filtered">已过滤候选</button><button data-view="recycle">已淘汰 / 恢复</button></nav>
<div class="canvas-workspace kana-work-grid">
<aside id="project-navigation" class="canvas-index kana-index" aria-label="项目与筛选"><div class="index-heading"><h2>这一帧，怎么留？</h2><button id="studio-collect" class="icon-button" aria-label="输入角色并开始取景"><svg viewBox="0 0 24 24" class="ui-icon" aria-hidden="true"><path d="M12 4v16M4 12h16"/></svg></button></div><section id="project-header" class="project-header"></section><details class="selection-statistics" open><summary>项目统计</summary><div id="stats" class="stats"></div></details><div id="canvas-filter-slot"></div><div class="side-heading"><span>最近项目</span><span><button id="archived-projects" class="icon-button" aria-label="查看已删除项目" hidden>↺</button><button id="new-project" class="icon-button" aria-label="新建角色项目">＋</button></span></div><label class="project-search-label">查找项目<input id="project-search" type="search" maxlength="400" placeholder="角色、服装或作品"></label><small id="project-nav-count"></small><nav id="project-list" aria-label="角色项目"></nav><button id="all-projects" class="quiet">全部项目</button></aside>
<div id="view"></div></div>
<footer class="workspace-footer"><span id="studio-take-counter" hidden>—</span><button id="optimize-skill-btn" class="quiet">查看人工淘汰理由</button><span id="version">v0.3</span></footer></main></div>
  <dialog id="reject-dialog" class="reject-dialog"><div class="reject-card"><h3>标记淘汰</h3><p class="muted">理由选填；Enter 直接淘汰，Esc 取消。</p><div class="quick-tags"><button type="button" class="quick-tag" data-tag="无关角色/非目标角色">无关角色</button><button type="button" class="quick-tag" data-tag="背景杂乱/路人多">背景杂乱</button><button type="button" class="quick-tag" data-tag="打光过曝/面部油光">光线问题</button><button type="button" class="quick-tag" data-tag="动作僵硬/无张力">动作僵硬</button><button type="button" class="quick-tag" data-tag="C服买家秀/非成片">买家秀</button><button type="button" class="quick-tag" data-tag="AI假图/非真人">非真人</button><button type="button" class="quick-tag" data-tag="无全身姿态参考">缺乏姿态参考</button></div><input id="reject-reason-input" type="text" placeholder="淘汰原因（选填）" autocomplete="off"><label class="check"><input type="checkbox" id="reject-aesthetic">这是审美不喜欢；质量问题或错角色不勾选</label><div class="button-row"><button id="reject-skip-btn" class="quiet">直接淘汰 (Enter)</button><button id="reject-confirm-btn" class="danger">记录理由并淘汰</button><button id="reject-cancel-btn" class="quiet">取消 (Esc)</button></div></div></dialog>
  <dialog id="editor" class="editor-dialog"><div class="dialog-header"><h2 id="editor-title"></h2><button id="editor-close" class="icon-button" aria-label="关闭对话框">×</button></div><div id="editor-content"></div></dialog>
  <dialog id="lightbox" class="lightbox"><div class="lightbox-bar"><span id="lightbox-title"></span><button id="lightbox-zoom">切换原尺寸</button><button id="lightbox-close">关闭</button></div><div class="lightbox-image"><img id="lightbox-image" alt="独立来源图片"></div></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
