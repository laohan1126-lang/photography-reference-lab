<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7faff">
  <title>参考实验室 · Kana's Focus Diary</title>
  <link rel="stylesheet" href="/static/styles.css?v=kana-direct-16">
  <link rel="stylesheet" href="/static/studio.css?v=kana-direct-16">
  <link rel="stylesheet" href="/static/kana.css?v=kana-direct-16">
  <script src="/static/studio.js?v=20261027-kana-stage" defer></script>
  <script src="/static/kana.js?v=kana-direct-16" defer></script>
  <script src="/static/library-browser.js?v=20261002" defer></script>
  <script src="/static/app.js?v=20261002" defer></script>
</head>
<body class="kana-workbench">
  <div id="login-screen" class="login-screen" hidden>
    <section class="login-card">
      <h1>留住喜欢的画面。</h1>
      <form id="login-form"><label>访问口令<input id="login-token" type="password" autocomplete="current-password" required placeholder="输入访问口令"></label><button class="primary" type="submit">进入参考库</button></form>
      <p id="login-error" class="error-text" role="alert"></p>
    </section>
  </div>
  <div id="application" class="app-shell" hidden>
    <aside class="sidebar">
      <a class="brand" href="/" aria-label="参考实验室首页"><span class="brand-mark" aria-hidden="true">R<span>.</span></span><span>参考实验室<small>THE REFERENCE DIARY</small></span></a>
      <nav class="photography-branches" aria-label="摄影工作区"><span aria-current="page">拍摄参考</span><a id="learning-link" href="/learning" aria-label="摄影学习">摄影学习 ↗</a></nav>
      <button id="toggle-project-nav" class="project-nav-toggle" type="button" aria-controls="project-navigation" aria-expanded="false" aria-label="打开项目与资料">项目与资料 <span aria-hidden="true">＋</span></button>
      <div id="project-navigation">
        <div class="side-heading"><span>拍摄项目</span><span><button id="archived-projects" class="icon-button" aria-label="查看已删除项目" hidden>↺</button><button id="new-project" class="icon-button" aria-label="新建角色项目">＋</button></span></div>
        <label class="project-search-label">搜索项目<input id="project-search" type="search" maxlength="400" placeholder="角色、服装或作品"></label>
        <small id="project-nav-count" class="project-nav-count"></small>
        <nav id="project-list" aria-label="角色项目"></nav>
        <button id="all-projects" class="quiet">全部项目</button>
        <nav id="global-nav" aria-label="我的资料"><button data-view="library">跨项目图库</button><button data-view="study">待筛摄影参考</button><button data-view="inspiration">我的审美库</button><button data-view="profile">审美画像</button><button data-view="jobs">采集任务</button><button data-view="notes">摄影笔记</button></nav>
        <button id="lock-library" class="quiet">锁定参考库</button>
      </div>
    </aside>
    <main class="workspace">
      <header class="topbar"><span>摄影参考 / 我的取景手帖</span><span id="connection-status">连接中</span></header>
      <section class="kana-masthead" data-studio-scene aria-label="加奈的取景手帖">
        <div class="kana-art-scene" aria-hidden="true"><img id="kana-theme-image" src="/static/private/kana/summer.webp" alt="" draggable="false"></div>
        <div class="kana-lettering">
          <div class="kana-signature" aria-label="Kana's"><img src="/static/ui-art/kana-wordmark.svg" alt="Kana's"><span lang="ja">好きな瞬間を、<br>ひとつずつ。</span></div>
          <h2><span>把喜欢，留在</span><em><img src="/static/ui-art/kana-frame.svg" alt="这一帧。"></em></h2>
        </div>
        <div class="kana-cover-tools"><span class="kana-cover-note" lang="ja">君だけの、フォーカス。</span><button id="studio-collect" class="kana-find" type="button">开始取景 <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19 20 3M5 3h15v15"/></svg></button><span class="kana-find-note">任意角色，自由找图</span></div>
        <svg class="kana-ink-line" viewBox="0 0 1440 20" preserveAspectRatio="none" aria-hidden="true"><path d="M0 14C250 24 350 2 580 12S940 25 1120 12 1320 6 1440 14"/></svg>
        <button id="kana-asset-notice" type="button" hidden>主题素材未安装 · 查看说明</button>
      </section>
      <section id="project-header" class="project-header"></section>
      <div class="kana-view-line">
        <nav id="view-tabs" class="view-tabs" aria-label="工作区视图"><button data-view="references" class="active">挑参考</button><button data-view="selected">角色精选</button><button data-view="field">现场卡</button><button data-view="filtered">已过滤候选</button><button data-view="recycle">已淘汰 / 恢复</button></nav>
        <details class="selection-statistics"><summary>项目统计</summary><div id="stats" class="stats" aria-label="项目统计"></div></details>
        <div class="kana-take"><small>正在看</small><strong id="studio-take-counter">—</strong></div>
      </div>
      <div id="view"></div>
      <footer class="workspace-footer"><span>你的选择，是下一次拍摄的开始。</span><button id="optimize-skill-btn" class="optimize-skill-btn" title="整理人工淘汰理由；不会同步 Skill">查看人工淘汰理由</button><span id="version">v0.2</span></footer>
    </main>
  </div>
  <dialog id="reject-dialog" class="reject-dialog"><div class="reject-card"><h3>标记淘汰</h3><p class="muted">理由选填；Enter 直接淘汰，Esc 取消。</p><div class="quick-tags"><button type="button" class="quick-tag" data-tag="无关角色/非目标角色">无关角色</button><button type="button" class="quick-tag" data-tag="背景杂乱/路人多">背景杂乱</button><button type="button" class="quick-tag" data-tag="打光过曝/面部油光">光线问题</button><button type="button" class="quick-tag" data-tag="动作僵硬/无张力">动作僵硬</button><button type="button" class="quick-tag" data-tag="C服买家秀/非成片">买家秀</button><button type="button" class="quick-tag" data-tag="AI假图/非真人">非真人</button><button type="button" class="quick-tag" data-tag="无全身姿态参考">缺乏姿态参考</button></div><input id="reject-reason-input" type="text" placeholder="淘汰原因（选填）" autocomplete="off"><label class="check"><input type="checkbox" id="reject-aesthetic">这是审美不喜欢；质量问题或错角色不勾选</label><div class="button-row"><button id="reject-skip-btn" class="quiet">直接淘汰 (Enter)</button><button id="reject-confirm-btn" class="danger">记录理由并淘汰</button><button id="reject-cancel-btn" class="quiet">取消 (Esc)</button></div></div></dialog>
  <dialog id="editor" class="editor-dialog"><div class="dialog-header"><h2 id="editor-title"></h2><button id="editor-close" class="icon-button" aria-label="关闭对话框">×</button></div><div id="editor-content"></div></dialog>
  <dialog id="lightbox" class="lightbox"><div class="lightbox-bar"><span id="lightbox-title"></span><button id="lightbox-zoom">切换原尺寸</button><button id="lightbox-close">关闭</button></div><div class="lightbox-image"><img id="lightbox-image" alt="独立来源图片"></div></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
