<!doctype html><html lang="zh-CN"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none';img-src 'self';style-src 'unsafe-inline';script-src 'unsafe-inline';connect-src 'self';base-uri 'none';form-action 'none'">
<link rel="icon" href="data:,"><title>摄影参考 · 独立评价</title>
<style>
body{margin:0;background:#f1efe9;color:#242622;font:16px/1.6 system-ui}main{max-width:1100px;margin:auto;padding:24px}h1{font-size:23px;margin:0}#layout{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;margin-top:20px}img{width:100%;height:72vh;object-fit:contain;background:#ddd9cf}fieldset{border:0;border-top:1px solid #ccc;padding:14px 0}legend{font-weight:bold}label{display:block;padding:7px 3px}button{font:inherit;padding:9px 16px;border:1px solid #888;border-radius:5px;background:white;cursor:pointer;margin:4px}button:focus-visible,a:focus-visible{outline:3px solid #356656}button:disabled{opacity:.45;cursor:default}#message{color:#72451b;min-height:28px}small{color:#65675e}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:18px}a{color:#285a4a}@media(max-width:650px){main{padding:14px}#layout{display:block}img{height:49vh}h1{font-size:20px}}
</style><main><h1 id="title">正在连接本地评价服务…</h1><small>每张原图按SHA只计一次。三项判断独立；可以选择无法确定。浏览不写正式图库。</small>
<p id="message" role="status" aria-live="polite"></p><div id="layout"><section><img id="photo" alt="当前待评价摄影参考"><p><span id="number"></span> · <a id="source" target="_blank" rel="noreferrer">来源页（作者未核实）</a></p></section>
<section><div id="choices"></div><button id="prev">上一张</button><button id="next">下一张</button><p><button id="submit">提交全部评价并计算冻结指标</button></p><small>已保存后刷新可恢复。提交后快照只读，不会自动继续实验。</small></section></div><pre id="report" hidden></pre></main>
<script>
const token='__TOKEN__';let state,index=0,busy=false;
const $=id=>document.getElementById(id);
const names={identity:'角色、服装版本与真人摄影是否正确',photography:'作为这次场照参考是否可用',aesthetic:'你自己是否喜欢'};
async function api(path,payload){const options={headers:{'X-Review-Token':token}};if(payload!==undefined){options.method='POST';options.headers['Content-Type']='application/json';options.body=JSON.stringify(payload)}const response=await fetch(path,options);const data=await response.json();if(!response.ok)throw Error(data.error||response.status);return data}
function message(text){$('message').textContent=text}
function render(){const asset=state.assets[index];$('title').textContent=state.title;$('number').textContent=`${index+1} / ${state.assets.length} · ${asset.asset_sha.slice(0,12)}`;$('photo').src='/image/'+asset.asset_sha;const u=asset.source.page_url||'';$('source').hidden=!/^https?:\/\//.test(u);$('source').href=$('source').hidden?'#':u;$('choices').replaceChildren();for(const [dim,options] of Object.entries(state.choices)){const field=document.createElement('fieldset'),legend=document.createElement('legend');legend.textContent=names[dim];field.append(legend);for(const [value,label] of Object.entries(options)){const line=document.createElement('label'),input=document.createElement('input');input.type='radio';input.name=dim;input.value=value;input.checked=state.labels[asset.asset_sha]?.[dim]===value;input.disabled=state.submitted||busy;input.onchange=()=>save(dim,value);line.append(input,document.createTextNode(' '+(dim==='identity'&&value==='target_cosplay'?'角色及祈雪灵祝版本正确、为真人独立摄影':label)));field.append(line)}$('choices').append(field)}$('prev').disabled=index===0||busy;$('next').disabled=index===state.assets.length-1||busy;$('submit').disabled=busy||state.submitted;if(state.submitted)message('已提交，快照只读。')}
async function save(dim,value){busy=true;const sha=state.assets[index].asset_sha;render();try{state={...state,...await api('/api/draft',{asset_sha:sha,labels:{[dim]:value}})};message('已保存')}catch(e){message('未保存：'+e.message)}finally{busy=false;render()}}
async function report(){const data=await api('/api/report');$('report').hidden=false;$('report').textContent=JSON.stringify(data,null,2)}
$('prev').onclick=()=>{if(!busy){index--;render()}};$('next').onclick=()=>{if(!busy){index++;render()}};$('submit').onclick=async()=>{if(busy)return;busy=true;render();try{await api('/api/submit',{});state={...state,...await api('/api/state')};await report()}catch(e){message(e.message)}finally{busy=false;render()}};
(async()=>{try{state=await api('/api/state');index=Math.max(0,state.assets.findIndex(a=>Object.keys(state.labels[a.asset_sha]||{}).length<3));render();if(state.submitted)await report()}catch(e){message('连接失败：'+e.message)}})();
</script></html>
