name: Apply reviewed library patch
on:
  push:
    branches: ['codex/library-discovery-optimization-20261002']
    paths: ['.github/workflows/apply-reviewed-library-patch.yml']
permissions:
  contents: read
jobs:
  apply-reviewed-code:
    if: github.ref == 'refs/heads/codex/library-discovery-optimization-20261002'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Refuse unexpected base or another branch
        run: |
          test "$(git rev-parse HEAD^)" = 378d2d562921e0ab985f485563cc6597467db0e2
          test "$GITHUB_REF" = refs/heads/codex/library-discovery-optimization-20261002
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact reviewed code-only patch and verify every changed blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, subprocess
          from pathlib import Path
          repo = 'laohan1126-lang/photography-reference-lab'
          chunks = ['39fd46c023580a71f7df022ef53120f84cf855c2', '14625ab148a0aee9784fcc930267aec5ca978a47', '97bf8c81c13db2f2c3a42232127199de3045310d', '3dab9082a0f5f91076a71c4ce77f43351bacff6f', '156ba783f4c7f3d1b66a2ba25e10b1953c2b3fd1']
          compressed = b''
          for sha in chunks:
              data = json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/git/blobs/{sha}']))
              raw = base64.b64decode(data['content'])
              assert hashlib.sha1(f'blob {len(raw)}\0'.encode()+raw).hexdigest() == sha
              compressed += raw
          patch = lzma.decompress(compressed, memlimit=128*1024*1024)
          assert len(patch) == 92606
          assert hashlib.sha256(patch).hexdigest() == '80fd13ba76137249758153bd00e117f7a50c3d856f992095815e5450690e41c9'
          expected = {
            'README.md':'c2eb84b6abc942244e654c221647173f2d8953cf',
            'docs/ARCHITECTURE.md':'5066ee7eb419b1abfa5aa610f7edbb48c8df26af',
            'docs/LIBRARY_DISCOVERY.md':'a9314fc4f5c25729c983c75d1ea8efae80e31630',
            'docs/tasks/2026-10-02-library-discovery-optimization.md':'b59bd3646fe535afe1050ba98524e6a1a5291444',
            'pyproject.toml':'21da1b231c48dcc842ff003df5c654286618bfef',
            'ref_lab/api.py':'e2f71e111f0c8815b98513387cbb93abb63741f5',
            'ref_lab/library_browser.py':'daa5a72c99e64e9a50b2e75365bc58c1438c47d1',
            'tests/test_collector_boundary_regressions.py':'4d128ad63887019c5ed965d7e933fcb4d1b02d7f',
            'tests/test_library_browser.py':'43481cc8b35b5e71744ea02bf914e5749475093d',
            'tests/test_library_browser_http.py':'8100cc832d664f3a91c201daa3cd8fd8787ed50c',
            'tests/test_library_browser_ui.py':'9032241453d3a911f47a5091a07c296e4439bc35',
            'tests/test_ui_components.py':'8d49a4fa8b48e07b0788068fb30600ca2c69f0f9',
            'tools/collect_adapter.py':'4421666a7a12cfc6fac7b3d385522394c3ec08fb',
            'web/app.js':'777acad376f49e1b9be82b2146efa3ae3c90d0ce',
            'web/index.html':'a9f08e9dd2376e38de6716edb9129736ff208a9a',
            'web/library-browser.js':'47ea411d38bebb4b125068120bed28d7ff6f2b9e',
            'web/styles.css':'4de7c2db98bff76c30aedef89e0519b2a8b75506'
          }
          subprocess.run(['git','apply','--index','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          changed = subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines()
          assert set(changed) == set(expected), changed
          for path, sha in expected.items():
              assert subprocess.check_output(['git','hash-object',path]).decode().strip() == sha, path
          print('Verified exact reviewed patch and 17 file hashes; no asset/runtime/workflow paths in application diff.')
          PY
      - run: python -m pip install -e '.[test]'
      - name: Verify new backend and collector contracts before commit
        run: |
          python -m pytest -q tests/test_library_browser.py tests/test_collect_adapter.py tests/test_collector_boundary_regressions.py
          node --check web/app.js
          node --check web/library-browser.js
          git diff --cached --check
      - name: Commit and fast-forward task branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "feat: asset-first gallery, saved searches and bounded project navigation"
          git push origin HEAD:refs/heads/codex/library-discovery-optimization-20261002
          git rev-parse HEAD
