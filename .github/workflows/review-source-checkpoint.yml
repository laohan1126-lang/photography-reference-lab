name: Code-only review checkpoint
on:
  push:
    branches: ['codex/library-discovery-optimization-20261002']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Package tracked code only (no git metadata, private data or reference images)
        run: |
          mkdir -p checkpoint
          git rev-parse HEAD > checkpoint/commit.txt
          git archive --format=tar -o checkpoint/source.tar HEAD ref_lab tools web tests scripts pyproject.toml AGENTS.md README.md docs notes/collection-workflow.md .github install.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: code-only-review-checkpoint
          path: checkpoint
          retention-days: 2
