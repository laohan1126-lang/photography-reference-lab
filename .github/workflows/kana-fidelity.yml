name: Kana fidelity verification
on:
  push:
    branches: ['codex/kana-fidelity-locked-20261027']
permissions:
  contents: read
concurrency:
  group: kana-fidelity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[test]'
      - name: Use an installed browser or install Chromium
        run: |
          BROWSER=$(command -v chromium || command -v google-chrome || true)
          if [ -n "$BROWSER" ]; then echo "LAB_CHROMIUM=$BROWSER" >> "$GITHUB_ENV"; else python -m playwright install --with-deps chromium; fi
      - name: Real application components, image geometry, static HTTP and login
        run: |
          mkdir -p test-results
          git rev-parse HEAD > test-results/source-commit.txt
          node --check web/kana.js
          python -m pytest -q tests/test_ui_components.py tests/test_kana_presentation.py tests/test_kana_static.py tests/test_kana_fidelity.py --junitxml=test-results/results.xml
        env:
          LAB_TEST_ARTIFACTS: test-results/browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kana-fidelity-functional-evidence
          path: test-results
          retention-days: 7
