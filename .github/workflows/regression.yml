name: Reference library regression
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q tests/test_library.py tests/test_imports_jobs.py tests/test_workers.py tests/test_operations.py tests/test_personal_library.py
      - run: node --check web/app.js
      - run: python -m compileall -q ref_lab tools
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m playwright install --with-deps chromium
      - run: |
          mkdir -p test-results
          git rev-parse HEAD > test-results/commit.txt
          python -m pytest -q tests/test_ui_components.py tests/test_browser.py tests/test_live_system_regression.py --junitxml=test-results/results.xml
        env:
          LAB_TEST_ARTIFACTS: test-results/browser
          LAB_TEST_REPORTS: test-results/reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-browser-evidence
          path: test-results
          if-no-files-found: warn
