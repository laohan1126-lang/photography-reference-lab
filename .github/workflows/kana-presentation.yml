name: Kana presentation regression
on:
  push:
    branches: ['codex/kana-direct-ui-20261027', 'codex/kana-immersive-atmosphere-20261027', 'codex/kana-painting-accepted-concept-20261027']
    paths: ['web/**', 'ref_lab/api.py', 'tests/test_kana_presentation.py', 'tests/test_kana_static.py', '.github/workflows/kana-presentation.yml']
  pull_request:
    paths: ['web/kana*', 'ref_lab/api.py', 'tests/test_kana_presentation.py', 'tests/test_kana_static.py']
permissions:
  contents: read
jobs:
  kana-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[test]'
      - name: Select actual browser without an unnecessary second download
        shell: bash
        run: |
          browser=""
          for candidate in chromium chromium-browser google-chrome google-chrome-stable; do
            if command -v "$candidate" >/dev/null 2>&1; then
              browser="$(command -v "$candidate")"
              break
            fi
          done
          if [ -n "$browser" ]; then
            "$browser" --version
            echo "LAB_CHROMIUM=$browser" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
          fi
      - run: node --check web/kana.js
      - run: |
          mkdir -p test-results
          git rev-parse HEAD > test-results/commit.txt
          python -m pytest -q tests/test_kana_presentation.py tests/test_kana_static.py --junitxml=test-results/kana-results.xml
        env:
          LAB_TEST_ARTIFACTS: test-results/browser
      - name: Export public frontend for local original-art design QA
        if: always()
        shell: bash
        run: |
          mkdir -p test-results
          tar -czf test-results/frontend-sources.tar.gz web tests/test_ui_components.py tests/test_kana_presentation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kana-synthetic-ui-evidence
          path: test-results
          if-no-files-found: warn
