[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "photography-reference-lab"
version = "0.3.0"
description = "Private, evidence-gated cosplay photography reference library"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.128,<1", "uvicorn>=0.34,<1", "pydantic>=2.11,<3",
  "python-multipart>=0.0.22,<1", "Pillow>=12.1,<13", "PyYAML>=6.0.2,<7", "httpx>=0.28,<1"
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10", "playwright>=1.50,<2"]

[project.scripts]
reference-lab = "ref_lab.cli:main"

[tool.setuptools]
packages = ["ref_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.data-files]
"share/photography-reference-lab/web" = ["web/index.html", "web/app.js", "web/styles.css"]
